<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trio</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23111'/%3E%3Ccircle cx='8' cy='16' r='4' fill='%23e8a21a'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23ff4a3d'/%3E%3Ccircle cx='24' cy='16' r='4' fill='%239ff0a8'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app" class="app">
      <header class="bar">
        <div class="brand">Trio <span id="room-label"></span></div>
        <div class="transport">
          <button id="play">Play</button>
          <button id="stop">Stop</button>
          <button id="copy" class="quiet">Copy pattern</button>
        </div>
        <div id="status" class="status"></div>
      </header>
      <main class="panels">
        <section class="panel synth" data-slot="synth"></section>
        <section class="panel drums" data-slot="drums"></section>
        <section class="panel bass" data-slot="bass"></section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
